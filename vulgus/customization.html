<body style="margin: 0; padding: 0; display: flex; flex-direction: column;">
<section id="title">

<div style="background-color: rgb(60, 255, 0); height: 2vh;" id="progress"></div>
</section>


<img src="pronounciation.jpg" style="width: 4.5em; height: 4.5em; align-self: center; margin: 1rem;" id="sound">
<div style="display: flex;flex-direction: row; width:100%;align-items: center; justify-content: center;">
<button class="options" onclick="getInfo('def')">Get Definition</button>
<p id="Definition"></p>
<button class="options" onclick="getInfo('POS')">Get Part of Speech</button>
<p id="POS" ></p>
<button class="options" onclick="getInfo('ex')">Get Example</button>

</div>

<div style="display: flex; flex-direction: column;" id="evilBee">

    <button style="align-self: center; padding: 1em; color: white; background-color: black; font-size: 1rem; width: 80%;" type="submit" id="submit">Done</button>
</div>
<div class="function" style="width: 80%; margin-top: 3rem; flex-direction: column;">
<input style="align-self: center; height:50vh; width: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-size: 1.3rem; text-align: center;" placeholder="Input A List of Words Separated By Commas" id="list">
<button style="align-self: center; padding: 1em; color: white; background-color: rgb(8, 43, 25); font-size: 1rem; width: 80%; margin-bottom: 2rem;" type="submit" id="set">Set List</button>
</div>
<section style="display: flex; flex-direction: row; width: 100%;">

        <p id="IW" class="done">
        </p>
    </div>
    <div style="background-color: rgb(189, 255, 189); width: 50%; display: flex; flex-direction: column;">
        <h1 style="font-family: 'Jockey One'; font-size: 3rem; padding:0.5rem; text-align: center;">Correct Words</h1>
    <p id="CW" class="done">

    </p>
</div>
</section>
<section id="title">

</section>

async function getInfo(mode) {
    try{
    const res = await fetch(`https://freedictionaryapi.com/api/v1/entries/en/${chosenWord.trim()}`)
    const info = await res.json()
    if (!res.ok) {
    throw new Error(`Response status: ${res.status}`)
        }
       console.log(info)

const definition = info.entries[0].senses[0].definition
console.log(definition)
let example = info.entries[0].senses[0].examples

if(example){
    example = example[0] 
}
if(!example){
    example = 'There is no sentence yet.'
}

if(example === " "){
    example = info.entries[0].senses[0].quotes
    
}

const POS = info.entries[0].partOfSpeech

if(mode === 'def')
{document.getElementById("Definition").textContent = definition

}
if(mode === 'ex')
{

{document.getElementById("POS").textContent = POS

console.log(chosenWord, definition, example, POS)
if (tr = 0){
